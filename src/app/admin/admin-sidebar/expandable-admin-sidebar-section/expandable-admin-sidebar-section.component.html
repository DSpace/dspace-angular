@if (hasSubSections$ | async) {
  @let isExpanded = (isExpanded$ | async);
  <div
    [ngClass]="{'expanded': isExpanded}"
     [@bgColor]="{
     value: (isExpanded ? 'endBackground' : 'startBackground'),
     params: {endColor: (sidebarActiveBg$ | async)}
     }">
    <button class="sidebar-section-wrapper btn btn-link border-0 p-0"
      tabindex="0"
      [attr.aria-controls]="adminMenuSectionId(section)"
      [attr.aria-expanded]="isExpanded"
      [attr.aria-label]="('menu.section.toggle.' + section.id) | translate"
      [class.disabled]="section.model?.disabled"
      [attr.aria-disabled]="section.model?.disabled || null"
      (click)="toggleSection($event)"
      (keyup.space)="toggleSection($event)"
    >
      <div class="sidebar-fixed-element-wrapper" data-test="sidebar-section-icon" aria-hidden="true">
        <i class="fas fa-{{section.icon ?? 'notdef'}} fa-fw"></i>
      </div>
      <div class="sidebar-collapsible-element-outer-wrapper">
        <div class="sidebar-collapsible-element-inner-wrapper sidebar-item toggler-wrapper">
          <span [id]="adminMenuSectionTitleAccessibilityHandle(section)" [attr.data-test]="adminMenuSectionTitleAccessibilityHandle(section) | dsBrowserOnly">
            @if (sectionMap().get(section.id); as sectionDTO) {
              <ng-container *ngComponentOutlet="sectionDTO.component; injector: sectionDTO.injector;"></ng-container>
            }
          </span>
          <i class="fas fa-chevron-right fa-xs" aria-hidden="true"
            [@rotate]="isExpanded ? 'expanded' : 'collapsed'"
          ></i>
        </div>
      </div>
    </button>
    <div class="sidebar-section-wrapper subsection"
      [hidden]="subsectionHidden"
      [@slide]="isExpanded ? 'expanded' : 'collapsed'"
      (@slide.done)="finishSlide($event)"
      [attr.aria-hidden]="!isExpanded || null"
      [attr.inert]="!isExpanded || null">
      <div class="sidebar-fixed-element-wrapper"></div>
      <div class="sidebar-collapsible-element-outer-wrapper">
        <div class="sidebar-collapsible-element-inner-wrapper">
          <div class="sidebar-sub-level-item-list" [id]="adminMenuSectionId(section)">
            @for (subSection of (subSections$ | async); track subSection) {
              <div class="sidebar-item">
                @if (sectionMap().get(subSection.id); as subSectionDTO) {
                  <ng-container *ngComponentOutlet="subSectionDTO.component; injector: subSectionDTO.injector;"></ng-container>
                }
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
}
