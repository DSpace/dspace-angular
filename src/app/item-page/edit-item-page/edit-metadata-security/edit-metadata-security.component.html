@if (securityConfigLevel?.length > 1) {
  <div class="switch-container">
    @for (secLevel of securityLevelsMap; track secLevel.value) {
      @let value = $any(secLevel).value;
      @let isActive = securityLevel === value;
      <div>
        <div class="switch-opt"
             [ngStyle]="{'background-color': isActive ? 'white' : 'rgb(204,204,204)' }">
          <button class="btn btn-link text-primary" data-test="switch-btn"
                  [title]="'metadata.security.level.title' | translate: { level: value }"
                  [dsBtnDisabled]="readOnly"
                  (click)="changeSelectedSecurityLevel(value)">
            <i [class]="$any(secLevel).icon"
               aria-hidden="true"
               [ngStyle]="{'color': isActive ? $any(secLevel).color : '' }"></i>
          </button>
        </div>
      </div>
    }

  </div>
}
