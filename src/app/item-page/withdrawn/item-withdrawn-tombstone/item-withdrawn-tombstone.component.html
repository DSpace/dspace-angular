@if (hasEntries()) {
  <div class="withdrawn-tombstone mt-2">
    <dl class="row mb-0">
      @for (entry of entries; track entry.label) {
        <dt class="col-sm-3 text-sm-end">{{ entry.label | translate }}</dt>
        <dd class="col-sm-9 mb-1">
          @if (entry.url) {
            <a [href]="entry.url" rel="noopener">{{ entry.value }}</a>
          } @else {
            {{ entry.value }}
          }
        </dd>
      }
    </dl>
  </div>
}
