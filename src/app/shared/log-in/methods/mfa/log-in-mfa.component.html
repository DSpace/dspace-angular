<div class="mfa-verification">
  <h5>{{ 'login.mfa.title' | translate }}</h5>
  <p class="text-muted">
    @if (!showRecoveryInput) {
      {{ 'login.mfa.description' | translate }}
    } @else {
      {{ 'login.mfa.recovery.description' | translate }}
    }
  </p>

  @if (error$ | async; as error) {
    <div class="alert alert-danger" role="alert">
      {{ error }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label for="mfa-code" class="form-label">
        @if (!showRecoveryInput) {
          {{ 'login.mfa.code.label' | translate }}
        } @else {
          {{ 'login.mfa.recovery.label' | translate }}
        }
      </label>
      <input
        id="mfa-code"
        type="text"
        class="form-control"
        formControlName="code"
        [attr.placeholder]="showRecoveryInput ? ('login.mfa.recovery.placeholder' | translate) : ('login.mfa.code.placeholder' | translate)"
        autocomplete="one-time-code"
        autofocus
      />
    </div>

    <div class="d-flex gap-2">
      <button
        type="submit"
        class="btn btn-primary"
        [dsBtnDisabled]="form.invalid || (verifying$ | async)"
      >
        @if (verifying$ | async) {
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        }
        {{ 'login.mfa.verify.button' | translate }}
      </button>
      <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
        {{ 'login.mfa.cancel.button' | translate }}
      </button>
    </div>
  </form>

  <div class="mt-3">
    <button type="button" class="btn btn-link p-0" (click)="toggleRecovery()">
      @if (!showRecoveryInput) {
        {{ 'login.mfa.use.recovery' | translate }}
      } @else {
        {{ 'login.mfa.use.totp' | translate }}
      }
    </button>
  </div>
</div>
