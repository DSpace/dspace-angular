<form (ngSubmit)="onSubmit({ query: query, searchType: 'lexical' })" action="/search">
  <div>
    <div class="mb-1 input-group">
      <span class="input-group-text">
        <i class="fas fa-search" aria-hidden="true"></i>
      </span>

      <input
        type="text"
        [(ngModel)]="query"
        name="query"
        class="form-control"
        [attr.aria-label]="searchPlaceholder"
        [attr.data-test]="'search-box' | dsBrowserOnly"
        [placeholder]="searchPlaceholder"
        tabindex="0"
      />

      <!-- BOTÃO 1: Pesquisa Exata -->
      <button
        type="button"
        class="search-button btn btn-{{ brandColor }}"
        [attr.data-test]="'search-button-lexical' | dsBrowserOnly"
        (click)="onSubmit({ query: query, searchType: 'lexical' })"
        [ngbTooltip]="'search.form.search-type.lexical.hint' | translate"
        container="body"
        triggers="hover focus"
        role="button"
        tabindex="0"
      >
        {{ "search.form.search-type.lexical" | translate: { default: 'Pesquisa Exata' } }}
      </button>

      <!-- BOTÃO 2: Pesquisa com IA -->
      @if (semanticSearchEnabled) {
        <button
          type="button"
          class="search-button btn btn-{{ brandColor }}"
          [attr.data-test]="'search-button-semantic' | dsBrowserOnly"
          (click)="onSubmit({ query: query, searchType: 'semantic' })"
          [ngbTooltip]="'search.form.search-type.semantic.hint' | translate"
          container="body"
          triggers="hover focus"
          role="button"
          tabindex="0"
        >
          {{ "search.form.search-type.semantic" | translate: { default: 'Pesquisa com IA' } }}
        </button>
      }
    </div>
  </div>
</form>
