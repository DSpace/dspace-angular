@if (derivedSearchResult$ | async) {
  <ds-item-list-preview
    [item]="(derivedSearchResult$ | async).indexableObject"
    [object]="object"
    [badgeContext]="badgeContext"
    [showSubmitter]="true"
    [workflowItem]="dso">
  </ds-item-list-preview>
  <div class="row">
    <div [ngClass]="showThumbnails ? 'offset-3 offset-md-2 col-9 col-md-10 ps-3' : ''">
      <ds-workflowitem-actions [object]="dso" (processCompleted)="reloadedObject.emit($event.reloadedObject)"></ds-workflowitem-actions>
    </div>
  </div>
}

@if ((derivedSearchResult$ | async) === undefined) {
  <ds-loading [showMessage]="false"></ds-loading>
}
